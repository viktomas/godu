on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [oldstable, stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - uses: actions/checkout@v7
      - run: go test ./...
