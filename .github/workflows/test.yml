on: [push, pull_request]
name: Test
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # golangci-lint v2.15.0 is built with go1.27, keep the toolchain in sync
          go-version: '1.27'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
  test:
    strategy:
      matrix:
        go-version: [oldstable, stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - uses: actions/checkout@v7
      - run: go test ./...
  terminal-smoke:
    # End-to-end check of the real terminal path: blank screens, the draw
    # hang, and tcell emission bugs that the headless render tests (and
    # tcell's own SimulationScreen) cannot reproduce.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build -o godu-bin .
      - run: ./scripts/terminal-smoke.sh "$PWD/godu-bin"
